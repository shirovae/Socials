<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shiroo ౨ৎ ˎˊ˗</title>
<link rel="icon" type="image/gif" href="senpai-mio.gif">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --cyan: #00F0FF;
    --pink: #FCEE0A;
    --bg: #050508;
    --text: #eaf6fa;
    --muted: rgba(235,245,250,0.45);

    --dc-bg: rgba(8, 12, 20, 0.55);
    --dc-bg-2: rgba(252,238,10, 0.10);
    --dc-bg-3: rgba(252,238,10, 0.18);
    --dc-text: #eaf6fa;
    --dc-muted: rgba(200, 235, 245, 0.55);
    --dc-header: rgba(0, 240, 255, 0.85);
    --dc-online: #23a55a;
    --dc-idle: #f0b232;
    --dc-dnd: #f23f42;
    --dc-offline: #80848e;
    --dc-ring: #0a0f18;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100dvh; width: 100vw; overflow: hidden;
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bg);
    color: var(--text);
  }

  @media (pointer: fine) {
    body { cursor: none; }
    #cur {
      position: fixed; width: 7px; height: 7px;
      background: var(--cyan); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 8px var(--cyan), 0 0 16px rgba(252,238,10,0.4);
    }
    #cur-r {
      position: fixed; width: 28px; height: 28px;
      border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
      opacity: 0;
    }
  }
  @media (pointer: coarse) { #cur, #cur-r { display: none !important; } }

  #bg-video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; opacity: .38;
    filter: saturate(.8) brightness(.5) contrast(1.15);
  }

  .bg-glow { position: fixed; border-radius: 50%; pointer-events: none; z-index: 1; }
  .bg-glow-a {
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(252,238,10,.15) 0%, transparent 65%);
    top: 50%; left: 50%; transform: translate(-50%,-60%);
    animation: breatheA 6s ease-in-out infinite alternate;
  }
  .bg-glow-b {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(252,238,10,.07) 0%, transparent 70%);
    bottom: 0; left: 10%;
    animation: breatheB 8s ease-in-out 2s infinite alternate;
  }
  @keyframes breatheA { to { transform: translate(-50%,-55%) scale(1.12); } }
  @keyframes breatheB { to { transform: translateY(-30px) scale(1.1); } }

  .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .star {
    position: absolute; opacity: 0;
    animation: twinkle var(--d,3s) var(--del,0s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0%   { opacity: 0; transform: scale(.5) rotate(0deg); }
    50%  { opacity: var(--op,.6); }
    100% { opacity: .1; transform: scale(1.2) rotate(20deg); }
  }

  #enter-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: #020306;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    transition: opacity .9s ease;
  }
  #enter-overlay::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(252,238,10,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(252,238,10,.05) 1px, transparent 1px);
    background-size: 70px 70px;
    pointer-events: none;
  }
  #enter-overlay.fade-out { opacity: 0; pointer-events: none; }
  #enter-overlay.gone     { display: none; }

  #enter-btn {
    position: relative; background: none; border: none; padding: 0;
    cursor: pointer !important;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform .35s cubic-bezier(.22,1,.36,1); z-index: 2;
    user-select: none; -webkit-user-select: none;
  }
  #enter-btn:hover { transform: translateY(-3px); }
  #enter-btn:active { transform: translateY(-1px) scale(.98); }

  .enter-card {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 46px 54px 40px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(10,16,28,.4), rgba(4,6,12,.55));
    border: 1px solid rgba(252,238,10,.28);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    box-shadow: 0 0 0 1px rgba(252,238,10,.05), 0 25px 70px rgba(252,238,10,.14), inset 0 1px 0 rgba(255,255,255,.06);
    transition: border-color .35s, box-shadow .35s;
    animation: cardBreathe 4.5s ease-in-out infinite;
  }
  @keyframes cardBreathe {
    0%,100% { box-shadow: 0 0 0 1px rgba(252,238,10,.05), 0 25px 70px rgba(252,238,10,.12), inset 0 1px 0 rgba(255,255,255,.06); }
    50%     { box-shadow: 0 0 0 1px rgba(252,238,10,.09), 0 25px 90px rgba(252,238,10,.22), inset 0 1px 0 rgba(255,255,255,.06); }
  }
  #enter-btn:hover .enter-card { border-color: rgba(252,238,10,.55); }
  .enter-card::before {
    content: ''; position: absolute; inset: 0; border-radius: 22px; padding: 1px;
    background: linear-gradient(160deg, rgba(255,255,255,.14), transparent 40%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }

  .e-avatar {
    width: 92px; height: 92px; border-radius: 50%; overflow: hidden; position: relative;
    box-shadow: 0 0 0 1.5px var(--pink), 0 0 28px rgba(252,238,10,.45);
    pointer-events: none;
  }
  .e-avatar::after {
    content: ''; position: absolute; inset: -7px; border-radius: 50%;
    border: 1px solid rgba(252,238,10,.35);
    animation: ringPulse 2.8s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%   { transform: scale(1); opacity: .7; }
    100% { transform: scale(1.14); opacity: 0; }
  }
  .e-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .e-textblock { display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .e-name {
    font-family: 'Bebas Neue', sans-serif; font-size: 2.1rem; color: #fff;
    letter-spacing: .1em; text-shadow: 0 0 30px rgba(252,238,10,.35);
  }
  .e-sub {
    font-family: 'IBM Plex Mono', monospace; font-size: .58rem;
    letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  }

  .e-cta {
    padding: 10px 40px; background: transparent;
    color: var(--pink); border: 1px solid var(--pink); border-radius: 100px;
    font-family: 'IBM Plex Mono', monospace; font-size: .66rem;
    letter-spacing: .2em; text-transform: uppercase;
    position: relative; overflow: hidden; transition: color .3s; display: block;
    pointer-events: none;
  }
  .e-cta::after {
    content: ''; position: absolute; inset: 0;
    background: var(--pink); transform: translateX(-100%);
    transition: transform .32s cubic-bezier(.22,1,.36,1); z-index: -1;
  }
  #enter-btn:hover .e-cta { color: #07050d; }
  #enter-btn:hover .e-cta::after { transform: translateX(0); }

  .e-dots { display: flex; gap: 5px; pointer-events: none; }
  .e-dots span {
    width: 4px; height: 4px; border-radius: 50%; background: var(--pink);
    animation: eDotBlink 1.4s ease-in-out infinite;
  }
  .e-dots span:nth-child(2) { animation-delay: .2s; }
  .e-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes eDotBlink {
    0%,100% { opacity: .15; transform: scale(.7); }
    50%     { opacity: 1; transform: scale(1); box-shadow: 0 0 5px var(--pink); }
  }

  #main {
    position: relative; z-index: 10;
    height: 100dvh; width: 100vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    overflow: hidden;
    opacity: 0; transition: opacity 1s ease .3s;
  }
  #main.visible { opacity: 1; }

  .top-bar {
    width: 100%; display: flex; justify-content: center; align-items: center;
    padding: 20px 24px 0; flex-shrink: 0;
  }
  .top-status {
    display: inline-flex; align-items: center; gap: 10px;
  }
  .top-status-avatar-wrap {
    position: relative; width: 30px; height: 30px; flex-shrink: 0;
  }
  .top-status-avatar {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    display: block; border: 1px solid rgba(255,255,255,.1);
  }
  .top-status-dot {
    position: absolute; right: -1px; bottom: -1px;
    width: 11px; height: 11px; border-radius: 50%;
    background: #80848e; border: 2.5px solid var(--bg);
    box-sizing: content-box; transition: background .4s;
  }
  .top-status-dot.online  { background: #3ba55c; box-shadow: 0 0 5px rgba(59,165,92,.8); }
  .top-status-dot.idle    { background: #faa81a; box-shadow: 0 0 5px rgba(250,168,26,.8); }
  .top-status-dot.dnd     { background: #ed4245; box-shadow: 0 0 5px rgba(237,66,69,.8); }
  .top-status-dot.offline { background: #80848e; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .82rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted);
  }
  .status-pill .s-bracket {
    color: rgba(235,245,250,.28);
    transition: color .4s;
  }
  .status-pill #status-label { transition: color .4s, text-shadow .4s; }
  .status-pill.online #status-label { color: rgba(59,165,92,.85); text-shadow: 0 0 8px rgba(59,165,92,.6); }
  .status-pill.online .s-bracket { color: rgba(59,165,92,.35); }
  .status-pill.idle   #status-label { color: rgba(250,168,26,.85); text-shadow: 0 0 8px rgba(250,168,26,.6); }
  .status-pill.idle   .s-bracket { color: rgba(250,168,26,.35); }
  .status-pill.dnd    #status-label { color: rgba(237,66,69,.9); text-shadow: 0 0 8px rgba(237,66,69,.6); }
  .status-pill.dnd    .s-bracket { color: rgba(237,66,69,.35); }

  .hero {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 0 20px; gap: 0;
    min-height: 0; overflow: hidden;
  }

  .hero-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 15vw, 12rem);
    line-height: .92; color: var(--pink);
    letter-spacing: .02em;
    text-shadow: 0 0 60px rgba(252,238,10,.25), 0 0 120px rgba(252,238,10,.1);
    opacity: 0; transform: translateY(30px);
    transition: opacity .8s cubic-bezier(.22,1,.36,1) .5s, transform .8s cubic-bezier(.22,1,.36,1) .5s;
    user-select: none;
  }
  #main.visible .hero-name { opacity: 1; transform: translateY(0); }

  .hero-name .wv {
    display: inline-block; white-space: pre;
    animation: nameWave 2.2s ease-in-out infinite;
    animation-delay: calc(var(--i) * 0.11s);
  }
  @keyframes nameWave {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-0.09em); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-name .wv { animation: none; }
  }

  .hero-tagline {
    font-size: clamp(.62rem, 1.3vw, .85rem);
    color: var(--muted); font-style: italic;
    letter-spacing: .05em; margin-top: 14px; min-height: 1.4em;
  }
  .cursor-blink {
    display: inline-block; width: 2px; height: 1em;
    background: var(--pink); margin-left: 2px; vertical-align: middle;
    animation: cblink .9s step-end infinite;
  }
  @keyframes cblink { 0%,100%{opacity:1} 50%{opacity:0} }

  .activity-divider {
    width: 44px; height: 1px; margin: 12px 0;
    background: linear-gradient(90deg, transparent, rgba(252,238,10,.55), transparent);
  }

  .hero-activity-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px;
  }
  .hero-activity {
    display: flex; align-items: center; gap: 10px;
    font-size: .68rem; color: var(--muted); letter-spacing: .06em;
    opacity: 0; transform: translateY(4px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .hero-activity.visible { opacity: 1; transform: translateY(0); }
  .act-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    flex-shrink: 0; transition: background .4s;
  }
  .act-dot.online  { background: #3ba55c; box-shadow: 0 0 6px rgba(59,165,92,.8); }
  .act-dot.idle    { background: #faa81a; box-shadow: 0 0 6px rgba(250,168,26,.8); }
  .act-dot.playing { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .act-dot.spotify { background: #1DB954; box-shadow: 0 0 8px rgba(29,185,84,.8); }
  .act-dot.dnd-d   { background: #ed4245; box-shadow: 0 0 6px rgba(237,66,69,.8); }

  .act-count-badge {
    display: none; align-items: center; gap: 5px;
    font-size: .55rem; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(252,238,10,.5); margin-top: 2px;
  }
  .act-count-badge.show { display: flex; }
  .act-count-badge span { color: var(--cyan); font-size: .6rem; }

  .hero-custom-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 100px;
    background: rgba(8, 12, 20, 0.45);
    border: 1px solid rgba(252,238,10,.22);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: .64rem; letter-spacing: .02em;
    color: rgba(235,245,250,.8);
    max-width: 80vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hero-custom-status .hcs-emoji:not(:empty) { line-height: 1; }
  .hero-custom-status .hcs-emoji img { width: 13px; height: 13px; display: block; }

  .bottom-links {
    width: 100%; flex-shrink: 0;
    padding: 0 12px max(16px, env(safe-area-inset-bottom, 16px));
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }

  .links-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 900px;
  }

  .link-card {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 4px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.07);
    background: rgba(255,255,255,.025);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    text-decoration: none;
    touch-action: manipulation;
    transition: border-color .2s, background .2s, transform .15s, box-shadow .2s;
    -webkit-tap-highlight-color: transparent;
    position: relative; overflow: hidden;
    min-width: 0;
  }
  .link-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(252,238,10,.5), transparent);
    transform: scaleX(0); transition: transform .28s ease;
  }
  @media (pointer: fine) {
    .link-card { cursor: none; }
    .link-card:hover {
      border-color: rgba(252,238,10,.3); background: rgba(252,238,10,.06);
      transform: translateY(-4px); box-shadow: 0 10px 28px rgba(252,238,10,.09);
    }
    .link-card:hover::before { transform: scaleX(1); }
    .link-card:hover .lc-name { color: var(--pink); }
  }
  @media (pointer: coarse) {
    .link-card:active { background: rgba(252,238,10,.08); transform: scale(.97); }
  }

  .lc-icon {
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .lc-icon svg { width: 100%; height: 100%; display: block; }
  .link-card .lc-icon svg { transition: fill .2s, opacity .2s; }

  .lc-name {
    font-size: .58rem; letter-spacing: .08em; text-transform: uppercase;
    color: rgba(240,234,248,.85); transition: color .2s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .lc-handle {
    font-size: .5rem; letter-spacing: .03em; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }

  .lc-handle.lc-live {
    display: inline-flex; align-items: center; gap: 4px;
    color: rgba(240,234,248,.6);
  }
  .lc-live-dot {
    width: 5px; height: 5px; border-radius: 50%; background: #FF0033; flex-shrink: 0;
    box-shadow: 0 0 6px rgba(255,0,51,.9);
    animation: liveDotPulse 1.6s ease-in-out infinite;
  }
  @keyframes liveDotPulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: .35; transform: scale(.8); }
  }
  .lc-live-num { transition: color .3s ease; }
  .lc-live-num.bump { color: var(--pink); }

  .dc-card-wrap {
    position: relative;
  }

  /* ───────────────────────────────────────────
     DISCORD PROFILE POPOUT (visual match)
  ─────────────────────────────────────────── */
  .dc-dropdown {
    position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    width: 300px; max-width: calc(100vw - 32px);
    border-radius: 14px;
    background: var(--dc-bg);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    padding: 0; z-index: 100;
    border: 1px solid rgba(252,238,10,.25);
    box-shadow: 0 12px 40px rgba(252,238,10,.35), 0 0 0 1px rgba(252,238,10,.08), inset 0 1px 0 rgba(255,255,255,.04);
    display: none; flex-direction: column;
    max-height: 460px; overflow: hidden;
    font-family: "gg sans", "IBM Plex Mono", monospace;
  }
  .dc-dropdown.open { display: flex; }

  .dc-scroll {
    overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
  }
  .dc-scroll::-webkit-scrollbar { width: 8px; }
  .dc-scroll::-webkit-scrollbar-track { background: transparent; }
  .dc-scroll::-webkit-scrollbar-thumb { background: rgba(252,238,10,.4); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }

  .dc-banner {
    height: 64px; width: 100%;
    background: linear-gradient(135deg, #FCEE0A 0%, #FCEE0A 60%, #00F0FF 100%);
    position: relative; flex-shrink: 0;
  }

  .dc-identity {
    padding: 0 16px 12px; position: relative;
  }
  .dc-identity-top {
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .dc-avatar-wrap {
    width: 80px; height: 80px; position: relative;
    margin-top: -40px;
  }
  .dc-go-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 12px; margin-bottom: 2px;
    border-radius: 6px; border: 1px solid rgba(252,238,10,.35);
    background: rgba(252,238,10,.12);
    color: var(--pink); text-decoration: none;
    font-size: .68rem; font-weight: 600; letter-spacing: .02em;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .dc-go-btn:hover { background: rgba(252,238,10,.22); border-color: rgba(252,238,10,.6); }
  .dc-go-btn:active { transform: scale(.95); }
  .dc-avatar-wrap img {
    width: 80px; height: 80px; border-radius: 50%;
    border: 6px solid var(--dc-ring);
    display: block; object-fit: cover; background: var(--dc-bg-2);
  }
  .dc-status-badge {
    position: absolute; right: 1px; bottom: 1px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--dc-offline);
    border: 6px solid var(--dc-ring);
    box-sizing: content-box;
    display: flex; align-items: center; justify-content: center;
  }
  .dc-status-badge.online { background: var(--dc-online); }
  .dc-status-badge.idle   { background: var(--dc-idle); }
  .dc-status-badge.dnd    { background: var(--dc-dnd); }
  .dc-status-badge.offline{ background: var(--dc-offline); }
  .dc-status-badge.idle::before {
    content:''; position:absolute; width:11px; height:11px; border-radius:50%;
    background: var(--dc-ring); top:3px; left:2px;
  }
  .dc-status-badge.dnd::before {
    content:''; position:absolute; width:10px; height:3px; border-radius:2px;
    background: var(--dc-ring);
  }

  .dc-name-block { margin-top: 10px; }
  .dc-display-name {
    font-size: 1.05rem; font-weight: 700; color: var(--dc-text);
    line-height: 1.2; letter-spacing: 0;
  }
  .dc-username {
    font-size: .72rem; color: var(--dc-muted); margin-top: 1px;
  }

  .dc-section-card {
    margin: 10px 16px 12px; padding: 10px;
    background: var(--dc-bg-2);
    border: 1px solid rgba(252,238,10,.14);
    border-radius: 10px;
  }
  .dc-section-card + .dc-section-card { margin-top: -2px; }

  .dc-custom-status {
    display: flex; align-items: center; gap: 8px;
    font-size: .8rem; color: var(--dc-text);
    padding: 2px 0;
  }
  .dc-custom-status img.emoji { width: 16px; height: 16px; }

  .dc-rp-header {
    font-size: .68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .02em; color: var(--dc-header);
    margin-bottom: 8px;
  }

  .dc-rp-row { display: flex; gap: 12px; }
  .dc-rp-art-wrap { position: relative; flex-shrink: 0; width: 60px; height: 60px; }
  .dc-rp-art {
    width: 60px; height: 60px; border-radius: 8px; object-fit: cover;
    background: var(--dc-bg-3); display: block;
  }
  .dc-rp-art-badge {
    position: absolute; right: -6px; bottom: -6px;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--dc-bg-3); border: 3px solid var(--dc-bg);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .dc-rp-art-badge img { width: 100%; height: 100%; object-fit: cover; }

  .dc-rp-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .dc-rp-title { font-size: .82rem; font-weight: 700; color: var(--dc-text); line-height: 1.25; }
  .dc-rp-detail { font-size: .78rem; color: var(--dc-header); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dc-rp-state { font-size: .78rem; color: var(--dc-header); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dc-rp-elapsed { font-size: .74rem; color: var(--dc-muted); margin-top: 3px; }

  .dc-sp-row { display: flex; gap: 12px; align-items: center; }
  .dc-sp-progress { margin-top: 8px; }
  .dc-sp-bar-track { height: 4px; border-radius: 2px; background: rgba(252,238,10,.16); overflow: hidden; }
  .dc-sp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--cyan)); border-radius: 2px; transition: width 1s linear; }
  .dc-sp-times { display: flex; justify-content: space-between; font-size: .62rem; color: var(--dc-muted); margin-top: 4px; }

  .dc-empty {
    padding: 20px 16px 22px; text-align: center;
    font-size: .76rem; color: var(--dc-muted);
  }

  .dc-loading-block {
    margin: 10px 16px 12px; height: 60px; border-radius: 10px;
    border: 1px solid rgba(252,238,10,.14);
    background: linear-gradient(90deg, rgba(252,238,10,.06) 25%, rgba(252,238,10,.16) 50%, rgba(252,238,10,.06) 75%);
    background-size: 600px 100%; animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer { 0%{background-position:-300px 0} 100%{background-position:300px 0} }

  .footer-txt {
    font-size: .5rem; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(240,234,248,.14); text-align: center;
  }

  #mute-btn {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom, 20px)); right: 16px;
    z-index: 200; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(252,238,10,.25); background: rgba(5,5,8,.72);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    transition: border-color .2s, background .2s, transform .15s, opacity .3s;
    opacity: 0; pointer-events: none; -webkit-tap-highlight-color: transparent;
  }
  #mute-btn.show { opacity: 1; pointer-events: all; }
  #mute-btn svg { width: 16px; height: 16px; fill: none; stroke: rgba(252,238,10,.75); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s; }
  @media (pointer: fine) {

    #mute-btn:hover { border-color: rgba(252,238,10,.55); background: rgba(252,238,10,.12); transform: scale(1.1); }

  }
  @media (pointer: coarse) {
    #mute-btn:active { transform: scale(.93); background: rgba(252,238,10,.15); }
  }

  @media (min-width: 700px) {

      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));

    .link-card { padding: 6px 8px; gap: 2px; }
    .lc-handle { display: none; }
  }

  /* ── CYBERPUNK: EDGERUNNERS ── */
  body::after {
    content:''; position: fixed; inset: 0; z-index: 9000; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0, rgba(0,0,0,.22) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
  }
  .bg-glow-b { background: radial-gradient(circle, rgba(0,240,255,.10) 0%, transparent 70%) !important; }

  }
  @keyframes glitchJitter {
    0%,92%,100% { transform: translate(0); filter: none; }
    93% { transform: translate(-4px,1px); filter: hue-rotate(40deg); }
    95% { transform: translate(5px,-2px); }
    97% { transform: translate(-2px,0); filter: hue-rotate(-40deg); }

  .enter-card, .link-card, .dc-dropdown, .hero-custom-status {

    <p class="footer-txt">Made By Laksh · 2026</p>
  </div>
</main>

<script>
(function(){
  'use strict';

  const overlay   = document.getElementById('enter-overlay');
  const mainEl    = document.getElementById('main');
  const muteBtn   = document.getElementById('mute-btn');
  const iconSound = document.getElementById('icon-sound');
  const iconMute  = document.getElementById('icon-mute');
  const video     = document.getElementById('bg-video');
  const audio     = document.getElementById('bg-audio');
  const enterBtn  = document.getElementById('enter-btn');
  video.muted = true;
  let isMuted = false;
  let entered = false;

  function doEnter() {
    if (entered) return;
    entered = true;
    overlay.classList.add('fade-out');
    mainEl.classList.add('visible');
    setTimeout(() => overlay.classList.add('gone'), 1000);
    video.play().catch(e => console.warn('Autoplay blocked:', e));
    audio.volume = 0.6;
    audio.play().catch(e => console.warn('Audio blocked:', e));
    setTimeout(() => muteBtn.classList.add('show'), 600);
  }

  enterBtn.addEventListener('click', doEnter);
  enterBtn.addEventListener('touchend', function(e) {
    e.preventDefault();
    doEnter();
  });

  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    isMuted = !isMuted;
    audio.muted = isMuted;
    iconSound.style.display = isMuted ? 'none' : '';
    iconMute.style.display  = isMuted ? ''     : 'none';
    muteBtn.setAttribute('aria-label', isMuted ? 'Unmute audio' : 'Mute audio');
  });

  const cur  = document.getElementById('cur');
  const curR = document.getElementById('cur-r');
  if (window.matchMedia('(pointer:fine)').matches && cur) {
    let mx=-100, my=-100, rx=-100, ry=-100;
    document.addEventListener('mousemove', e => {
      mx=e.clientX; my=e.clientY;
      cur.style.left=mx+'px'; cur.style.top=my+'px';
    });
    (function loop(){ rx+=(mx-rx)*.12; ry+=(my-ry)*.12; curR.style.left=rx+'px'; curR.style.top=ry+'px'; requestAnimationFrame(loop); })();
    document.querySelectorAll('a,button,.link-card').forEach(el => {
      el.addEventListener('mouseenter',()=>{ cur.classList.add('h'); curR.classList.add('h'); });
      el.addEventListener('mouseleave',()=>{ cur.classList.remove('h'); curR.classList.remove('h'); });
    });
  }

  /* wave effect on hero name */
  (function(){
    const h = document.querySelector('.hero-name');
    if (!h) return;
    const txt = h.textContent;
    h.setAttribute('aria-label', txt);
    h.textContent = '';
    [...txt].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'wv';
      s.style.setProperty('--i', i);
      s.setAttribute('aria-hidden', 'true');
      s.textContent = ch;
      h.appendChild(s);
    });
  })();

  /* click to copy Riot ID */
  (function(){
    const card = document.getElementById('riot-card');
    const handle = document.getElementById('riot-handle');
    if (!card || !handle) return;
    const RIOT_ID = 'Laksh #灰宮美桜';
    let t = null;

    function fallbackCopy(text){
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:-100px;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      return ok;
    }

    function flash(msg){
      handle.textContent = msg;
      handle.style.color = 'var(--pink)';
      clearTimeout(t);
      t = setTimeout(() => { handle.textContent = RIOT_ID; handle.style.color = ''; }, 1400);
    }

    function copy(){
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(RIOT_ID).then(() => flash('copied!'), () => flash(fallbackCopy(RIOT_ID) ? 'copied!' : 'copy failed'));
      } else {
        flash(fallbackCopy(RIOT_ID) ? 'copied!' : 'copy failed');
      }
    }

    card.addEventListener('click', copy);
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy(); }
    });
  })();

  const starsEl = document.getElementById('stars');
  for (let i=0; i<26; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random()*3+2;
    const isPink = Math.random() > .45;
    s.style.cssText = [
      'width:'+sz+'px','height:'+sz+'px',
      'top:'+Math.random()*100+'%','left:'+Math.random()*100+'%',
      '--d:'+(2+Math.random()*5)+'s','--del:'+(Math.random()*6)+'s',
      '--op:'+(0.3+Math.random()*.5),
      'border-radius:'+(Math.random()>.5?'50%':'2px'),
      'background:'+(isPink?'var(--pink)':'var(--cyan)')
    ].join(';');
    starsEl.appendChild(s);
  }

  const LINES = [
    '18 · Gamer',
    'Haimiyaholic',
    'Stay kind because that\'s something no one can take away from you',
    'Grinding Ranked Like It\'s A Job',
  ];
  let li=0, ci=0, del=false;
  const tEl = document.getElementById('tagline');
  function type(){
    const line=LINES[li];
    if (!del) {
      tEl.innerHTML=line.slice(0,ci+1)+'<span class="cursor-blink"></span>';
      ci++;
      if (ci>=line.length){ del=true; setTimeout(type,2000); return; }
    } else {
      tEl.innerHTML=line.slice(0,ci)+'<span class="cursor-blink"></span>';
      ci--;
      if (ci<0){ del=false; li=(li+1)%LINES.length; ci=0; setTimeout(type,380); return; }
    }
    setTimeout(type, del?38:60);
  }
  setTimeout(type,1300);

  const statusPill    = document.getElementById('status-pill');
  const statusLabel   = document.getElementById('status-label');
  const actDot        = document.getElementById('act-dot');
  const actText       = document.getElementById('act-text');
  const dcdContent    = document.getElementById('dcd-content');
  const dcHandle      = document.getElementById('dc-card-handle');
  const dcStatusBadge = document.getElementById('dc-status-badge');
  const topStatusDot  = document.getElementById('top-status-dot');
  const heroWrap      = document.getElementById('hero-activity-wrap');
  const activityDivider = document.getElementById('activity-divider');
  const actCountBadge = document.getElementById('act-count-badge');
  const actCountNum   = document.getElementById('act-count-num');
  let spTimer = null;

  function setStatus(s) {
    const m={online:'ONLINE',idle:'IDLE',dnd:'DO NOT DISTURB',offline:'OFFLINE'};
    statusPill.className='status-pill '+(s==='dnd'?'dnd':s==='idle'?'idle':s==='online'?'online':'');
    statusLabel.textContent=m[s]||s.toUpperCase();
    dcStatusBadge.className='dc-status-badge '+(s==='dnd'?'dnd':s==='idle'?'idle':s==='online'?'online':'offline');
    topStatusDot.className='top-status-dot '+(s==='dnd'?'dnd':s==='idle'?'idle':s==='online'?'online':'offline');
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function fmtT(ms){ const s=Math.floor(ms/1e3),m=Math.floor(s/60),h=Math.floor(m/60); return h>0?h+'h '+(m%60)+'m':m>0?m+'m '+(s%60)+'s':s+'s'; }
  function fmtClock(ms){ const tot=Math.max(0,Math.floor(ms/1e3)); const m=Math.floor(tot/60), s=tot%60; return m+':'+String(s).padStart(2,'0'); }

  function renderHeroActivities(sp, others, status, custom) {
    heroWrap.querySelectorAll('.act-extra').forEach(el => el.remove());
    const allItems = [];
    if (sp) allItems.push({ dotClass:'act-dot spotify', text: sp.song+' — '+sp.artist });
    others.forEach(act => {
      if (!act.name) return;
      allItems.push({ dotClass:'act-dot playing', text: act.name+(act.details?' · '+act.details:'') });
    });

    const primary = document.getElementById('act-primary');
    const customEl = document.getElementById('hero-custom-status');

    // Custom status is always shown independently, whenever one is set.
    if (custom && custom.state) {
      const em = custom.emoji
        ? (custom.emoji.id ? `<img src="https://cdn.discordapp.com/emojis/${custom.emoji.id}.webp?size=20" alt="">` : custom.emoji.name)
        : '';
      document.getElementById('hcs-emoji').innerHTML = em;
      document.getElementById('hcs-text').textContent = custom.state;
      customEl.style.display = 'inline-flex';
    } else {
      customEl.style.display = 'none';
    }

    if (allItems.length === 0) {
      heroWrap.style.display = 'none';
      activityDivider.style.display = 'none';
      actCountBadge.classList.remove('show');
      primary.style.display = 'none';
      primary.classList.remove('visible');
      return;
    }

    heroWrap.style.display = '';
    activityDivider.style.display = '';
    primary.style.display = '';
    actDot.className = allItems[0].dotClass;
    actText.textContent = allItems[0].text;
    for (let i=1; i<allItems.length; i++) {
      const row = document.createElement('div');
      row.className = 'hero-activity act-extra';
      const dot = document.createElement('span'); dot.className = allItems[i].dotClass;
      const txt = document.createElement('span'); txt.textContent = allItems[i].text;
      row.appendChild(dot); row.appendChild(txt);
      heroWrap.appendChild(row);
      requestAnimationFrame(() => setTimeout(() => row.classList.add('visible'), i*80));
    }
    if (allItems.length > 1) { actCountNum.textContent=allItems.length; actCountBadge.classList.add('show'); }
    else actCountBadge.classList.remove('show');
    requestAnimationFrame(() => primary.classList.add('visible'));
  }

  function renderDcHandle(sp, others) {
    const total = (sp?1:0)+others.length;
    dcHandle.textContent = total===0 ? 'activity' : total===1 ? (sp?'listening':'playing') : total+' active';
  }

  function renderAll(data) {
    if (spTimer){ clearInterval(spTimer); spTimer=null; }
    const status = data.discord_status||'offline';
    setStatus(status);
    const acts   = data.activities||[];
    const sp     = data.spotify;
    const custom = acts.find(a=>a.type===4);
    const others = acts.filter(a=>a.type!==4&&a.type!==2);
    renderHeroActivities(sp, others, status, custom);
    renderDcHandle(sp, others);

    let html='';

    if (custom&&custom.state) {
      const em = custom.emoji ? (custom.emoji.id ? `<img class="emoji" src="https://cdn.discordapp.com/emojis/${custom.emoji.id}.webp?size=20" alt="">` : custom.emoji.name) : '';
      html += `<div class="dc-section-card"><div class="dc-custom-status"><span>${em}</span><span>${esc(custom.state)}</span></div></div>`;
    }

    if (sp) {
      const hasTimes = sp.timestamps && sp.timestamps.start && sp.timestamps.end;
      const elapsed = hasTimes ? Date.now()-sp.timestamps.start : 0;
      const total = hasTimes ? sp.timestamps.end-sp.timestamps.start : 0;
      const pct = hasTimes ? Math.min(100,(elapsed/total)*100) : 0;
      html += `<div class="dc-section-card">
        <div class="dc-rp-header">Listening to Spotify</div>
        <div class="dc-sp-row">
          <div class="dc-rp-art-wrap">
            <img class="dc-rp-art" src="${esc(sp.album_art_url||'')}" alt="" onerror="this.style.visibility='hidden'">
            <div class="dc-rp-art-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
            </div>
          </div>
          <div class="dc-rp-info">
            <div class="dc-rp-title">${esc(sp.song)}</div>
            <div class="dc-rp-detail">by ${esc(sp.artist)}</div>
            ${sp.album?`<div class="dc-rp-state">on ${esc(sp.album)}</div>`:''}
          </div>
        </div>
        ${hasTimes?`<div class="dc-sp-progress">
          <div class="dc-sp-bar-track"><div class="dc-sp-bar-fill" id="dc-sp-bar" style="width:${pct}%"></div></div>
          <div class="dc-sp-times"><span id="dc-sp-elapsed">${fmtClock(elapsed)}</span><span>${fmtClock(total)}</span></div>
        </div>`:''}
      </div>`;
    }

    if (others.length>0) {
      others.forEach((act)=>{
        if (!act.name) return;
        const li2 = act.assets?.large_image ? (act.assets.large_image.startsWith('mp:external/') ? 'https://media.discordapp.net/external/'+act.assets.large_image.slice(12) : `https://cdn.discordapp.com/app-assets/${act.application_id}/${act.assets.large_image}.webp`) : '';
        const si2 = act.assets?.small_image ? (act.assets.small_image.startsWith('mp:external/') ? 'https://media.discordapp.net/external/'+act.assets.small_image.slice(12) : `https://cdn.discordapp.com/app-assets/${act.application_id}/${act.assets.small_image}.webp`) : '';
        const el=act.timestamps?.start ? Date.now()-act.timestamps.start : null;
        html+=`<div class="dc-section-card">
          <div class="dc-rp-header">Playing a Game</div>
          <div class="dc-rp-row">
            <div class="dc-rp-art-wrap">
              ${li2?`<img class="dc-rp-art" src="${esc(li2)}" alt="" onerror="this.style.visibility='hidden'">`:'<div class="dc-rp-art"></div>'}
              ${si2?`<div class="dc-rp-art-badge"><img src="${esc(si2)}" alt=""></div>`:''}
            </div>
            <div class="dc-rp-info">
              <div class="dc-rp-title">${esc(act.name)}</div>
              ${act.details?`<div class="dc-rp-detail">${esc(act.details)}</div>`:''}
              ${act.state?`<div class="dc-rp-state">${esc(act.state)}</div>`:''}
              ${el!==null?`<div class="dc-rp-elapsed">${fmtT(el)} elapsed</div>`:''}
            </div>
          </div>
        </div>`;
      });
    }

    if (!html) html='<div class="dc-empty">No activity right now</div>';
    dcdContent.innerHTML=html;

    if (sp && sp.timestamps && sp.timestamps.start && sp.timestamps.end) {
      const tot=sp.timestamps.end-sp.timestamps.start;
      spTimer=setInterval(()=>{
        const b=document.getElementById('dc-sp-bar');
        const t=document.getElementById('dc-sp-elapsed');
        if(!b){clearInterval(spTimer);return;}
        const e=Date.now()-sp.timestamps.start;
        b.style.width=Math.min(100,(e/tot)*100)+'%';
        if (t) t.textContent=fmtClock(e);
      },1000);
    }
  }

  const dcToggle = document.getElementById('dc-toggle-card');
  const dcDrop   = document.getElementById('dc-dropdown');
  dcToggle.addEventListener('click', e=>{ e.stopPropagation(); dcDrop.classList.toggle('open'); });
  dcToggle.addEventListener('touchend', e=>{ e.preventDefault(); e.stopPropagation(); dcDrop.classList.toggle('open'); });
  document.addEventListener('click', ()=>dcDrop.classList.remove('open'));
  document.addEventListener('touchend', ()=>dcDrop.classList.remove('open'));

  const DISCORD_ID='657910178577907713';
  function fetchL(){
    fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
      .then(r=>r.json())
      .then(j=>{ if(j.success) renderAll(j.data); else { setStatus('offline'); actText.textContent='could not load'; }})
      .catch(()=>{ setStatus('offline'); actText.textContent='could not load'; });
  }
  fetchL();
  setInterval(fetchL,30000);

  (function wsConnect(){
    const ws=new WebSocket('wss://api.lanyard.rest/socket');
    ws.onopen=()=>ws.send(JSON.stringify({op:2,d:{subscribe_to_id:DISCORD_ID}}));
    ws.onmessage=e=>{
      const m=JSON.parse(e.data);
      if(m.op===1) setInterval(()=>ws.readyState===1&&ws.send(JSON.stringify({op:3})),m.d.heartbeat_interval);
      if(m.op===0&&m.t==='INIT_STATE')      renderAll(m.d);
      if(m.op===0&&m.t==='PRESENCE_UPDATE') renderAll(m.d);
    };
    ws.onclose=()=>setTimeout(wsConnect,5000);
  })();

})();
</script>
</body>
</html>

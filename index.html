<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#050508"/>
<title>Shiroo ౨ৎ ˎˊ˗</title>
<link rel="icon" type="image/gif" href="senpai-mio.gif">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --cyan: #00F0FF;
    --pink: #FCEE0A;
    --bg: #050508;
    --text: #eaf6fa;
    --muted: rgba(235,245,250,0.45);

    --dc-bg: rgba(8, 12, 20, 0.55);
    --dc-bg-2: rgba(252,238,10, 0.10);
    --dc-bg-3: rgba(252,238,10, 0.18);
    --dc-text: #eaf6fa;
    --dc-muted: rgba(200, 235, 245, 0.55);
    --dc-header: rgba(0, 240, 255, 0.85);
    --dc-online: #23a55a;
    --dc-idle: #f0b232;
    --dc-dnd: #f23f42;
    --dc-offline: #80848e;
    --dc-ring: #0a0f18;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100dvh; width: 100%; overflow: hidden;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    font-family: 'IBM Plex Mono', monospace;
    background: var(--bg);
    color: var(--text);
  }

  @media (pointer: fine) {
    body { cursor: none; }
    #cur {
      position: fixed; width: 7px; height: 7px;
      background: var(--cyan); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 8px var(--cyan), 0 0 16px rgba(252,238,10,0.4);
    }
    #cur-r {
      position: fixed; width: 28px; height: 28px;
      border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%,-50%);
      opacity: 0;
    }
  }
  @media (pointer: coarse) { #cur, #cur-r { display: none !important; } }

  #bg-video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0; opacity: .38;
    filter: saturate(.8) brightness(.5) contrast(1.15);
  }

  .bg-glow { position: fixed; border-radius: 50%; pointer-events: none; z-index: 1; }
  .bg-glow-a {
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(252,238,10,.15) 0%, transparent 65%);
    top: 50%; left: 50%; transform: translate(-50%,-60%);
    animation: breatheA 6s ease-in-out infinite alternate;
  }
  .bg-glow-b {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(252,238,10,.07) 0%, transparent 70%);
    bottom: 0; left: 10%;
    animation: breatheB 8s ease-in-out 2s infinite alternate;
  }
  @keyframes breatheA { to { transform: translate(-50%,-55%) scale(1.12); } }
  @keyframes breatheB { to { transform: translateY(-30px) scale(1.1); } }

  .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .star {
    position: absolute; opacity: 0;
    animation: twinkle var(--d,3s) var(--del,0s) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    0%   { opacity: 0; transform: scale(.5) rotate(0deg); }
    50%  { opacity: var(--op,.6); }
    100% { opacity: .1; transform: scale(1.2) rotate(20deg); }
  }

  #enter-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: #020306;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    transition: opacity .9s ease;
  }
  #enter-overlay::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(252,238,10,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(252,238,10,.05) 1px, transparent 1px);
    background-size: 70px 70px;
    pointer-events: none;
  }
  #enter-overlay.fade-out { opacity: 0; pointer-events: none; }
  #enter-overlay.gone     { display: none; }

  #enter-btn {
    position: relative; background: none; border: none; padding: 0;
    cursor: pointer !important;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform .35s cubic-bezier(.22,1,.36,1); z-index: 2;
    user-select: none; -webkit-user-select: none;
  }
  #enter-btn:hover { transform: translateY(-3px); }
  #enter-btn:active { transform: translateY(-1px) scale(.98); }

  .enter-card {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    padding: 46px 54px 40px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(10,16,28,.4), rgba(4,6,12,.55));
    border: 1px solid rgba(252,238,10,.28);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    box-shadow: 0 0 0 1px rgba(252,238,10,.05), 0 25px 70px rgba(252,238,10,.14), inset 0 1px 0 rgba(255,255,255,.06);
    transition: border-color .35s, box-shadow .35s;
    animation: cardBreathe 4.5s ease-in-out infinite;
  }
  @keyframes cardBreathe {
    0%,100% { box-shadow: 0 0 0 1px rgba(252,238,10,.05), 0 25px 70px rgba(252,238,10,.12), inset 0 1px 0 rgba(255,255,255,.06); }
    50%     { box-shadow: 0 0 0 1px rgba(252,238,10,.09), 0 25px 90px rgba(252,238,10,.22), inset 0 1px 0 rgba(255,255,255,.06); }
  }
  #enter-btn:hover .enter-card { border-color: rgba(252,238,10,.55); }
  .enter-card::before {
    content: ''; position: absolute; inset: 0; border-radius: 22px; padding: 1px;
    background: linear-gradient(160deg, rgba(255,255,255,.14), transparent 40%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }

  .e-avatar {
    width: 92px; height: 92px; border-radius: 50%; overflow: hidden; position: relative;
    box-shadow: 0 0 0 1.5px var(--pink), 0 0 28px rgba(252,238,10,.45);
    pointer-events: none;
  }
  .e-avatar::after {
    content: ''; position: absolute; inset: -7px; border-radius: 50%;
    border: 1px solid rgba(252,238,10,.35);
    animation: ringPulse 2.8s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%   { transform: scale(1); opacity: .7; }
    100% { transform: scale(1.14); opacity: 0; }
  }
  .e-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .e-textblock { display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .e-name {
    font-family: 'Bebas Neue', sans-serif; font-size: 2.1rem; color: #fff;
    letter-spacing: .1em; text-shadow: 0 0 30px rgba(252,238,10,.35);
  }
  .e-sub {
    font-family: 'IBM Plex Mono', monospace; font-size: .58rem;
    letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  }

  .e-cta {
    padding: 10px 40px; background: transparent;
    color: var(--pink); border: 1px solid var(--pink); border-radius: 100px;
    font-family: 'IBM Plex Mono', monospace; font-size: .66rem;
    letter-spacing: .2em; text-transform: uppercase;
    position: relative; overflow: hidden; transition: color .3s; display: block;
    pointer-events: none;
  }
  .e-cta::after {
    content: ''; position: absolute; inset: 0;
    background: var(--pink); transform: translateX(-100%);
    transition: transform .32s cubic-bezier(.22,1,.36,1); z-index: -1;
  }
  #enter-btn:hover .e-cta { color: #07050d; }
  #enter-btn:hover .e-cta::after { transform: translateX(0); }

  .e-dots { display: flex; gap: 5px; pointer-events: none; }
  .e-dots span {
    width: 4px; height: 4px; border-radius: 50%; background: var(--pink);
    animation: eDotBlink 1.4s ease-in-out infinite;
  }
  .e-dots span:nth-child(2) { animation-delay: .2s; }
  .e-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes eDotBlink {
    0%,100% { opacity: .15; transform: scale(.7); }
    50%     { opacity: 1; transform: scale(1); box-shadow: 0 0 5px var(--pink); }
  }

  #main {
    position: relative; z-index: 10;
    height: 100dvh; width: 100vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    overflow: hidden;
    opacity: 0; transition: opacity 1s ease .3s;
  }
  #main.visible { opacity: 1; }

  .top-bar {
    width: 100%; display: flex; justify-content: center; align-items: center;
    padding: 20px 24px 0; flex-shrink: 0;
  }
  .top-status {
    display: inline-flex; align-items: center; gap: 10px;
  }
  .top-status-avatar-wrap {
    position: relative; width: 30px; height: 30px; flex-shrink: 0;
  }
  .top-status-avatar {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    display: block; border: 1px solid rgba(255,255,255,.1);
  }
  .top-status-dot {
    position: absolute; right: -1px; bottom: -1px;
    width: 11px; height: 11px; border-radius: 50%;
    background: #80848e; border: 2.5px solid var(--bg);
    box-sizing: content-box; transition: background .4s;
  }
  .top-status-dot.online  { background: #3ba55c; box-shadow: 0 0 5px rgba(59,165,92,.8); }
  .top-status-dot.idle    { background: #faa81a; box-shadow: 0 0 5px rgba(250,168,26,.8); }
  .top-status-dot.dnd     { background: #ed4245; box-shadow: 0 0 5px rgba(237,66,69,.8); }
  .top-status-dot.offline { background: #80848e; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .82rem; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted);
  }
  .status-pill .s-bracket {
    color: rgba(235,245,250,.28);
    transition: color .4s;
  }
  .status-pill #status-label { transition: color .4s, text-shadow .4s; }
  .status-pill.online #status-label { color: rgba(59,165,92,.85); text-shadow: 0 0 8px rgba(59,165,92,.6); }
  .status-pill.online .s-bracket { color: rgba(59,165,92,.35); }
  .status-pill.idle   #status-label { color: rgba(250,168,26,.85); text-shadow: 0 0 8px rgba(250,168,26,.6); }
  .status-pill.idle   .s-bracket { color: rgba(250,168,26,.35); }
  .status-pill.dnd    #status-label { color: rgba(237,66,69,.9); text-shadow: 0 0 8px rgba(237,66,69,.6); }
  .status-pill.dnd    .s-bracket { color: rgba(237,66,69,.35); }

  .hero {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 0 20px; gap: 0;
    min-height: 0; overflow: hidden;
  }

  .hero-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(4rem, 15vw, 12rem);
    line-height: .92; color: var(--pink);
    letter-spacing: .02em;
    text-shadow: 0 0 60px rgba(252,238,10,.25), 0 0 120px rgba(252,238,10,.1);
    opacity: 0; transform: translateY(30px);
    transition: opacity .8s cubic-bezier(.22,1,.36,1) .5s, transform .8s cubic-bezier(.22,1,.36,1) .5s;
    user-select: none;
  }
  #main.visible .hero-name { opacity: 1; transform: translateY(0); }

  .hero-name .wv {
    display: inline-block; white-space: pre;
    animation: nameWave 2.2s ease-in-out infinite, flickerOn 1.1s steps(1) 1;
    animation-delay: calc(var(--i) * 0.11s), calc(.7s + var(--i) * .08s);
    animation-fill-mode: none, backwards;
  }
  @keyframes nameWave {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-0.09em); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-name .wv { animation: none; }
  }

  .hero-tagline {
    font-size: clamp(.62rem, 1.3vw, .85rem);
    color: var(--muted); font-style: italic;
    letter-spacing: .05em; margin-top: 14px; min-height: 1.4em;
  }
  .cursor-blink {
    display: inline-block; width: 2px; height: 1em;
    background: var(--pink); margin-left: 2px; vertical-align: middle;
    animation: cblink .9s step-end infinite;
  }
  @keyframes cblink { 0%,100%{opacity:1} 50%{opacity:0} }

  .activity-divider {
    width: 44px; height: 1px; margin: 12px 0;
    background: linear-gradient(90deg, transparent, rgba(252,238,10,.55), transparent);
  }

  .hero-activity-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 5px; min-height: 44px;
  }
  .hero-activity {
    display: flex; align-items: center; gap: 10px;
    font-size: .68rem; color: var(--muted); letter-spacing: .06em;
    opacity: 0; transform: translateY(4px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .hero-activity.visible { opacity: 1; transform: translateY(0); }
  .act-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    flex-shrink: 0; transition: background .4s;
  }
  .act-dot.online  { background: #3ba55c; box-shadow: 0 0 6px rgba(59,165,92,.8); }
  .act-dot.idle    { background: #faa81a; box-shadow: 0 0 6px rgba(250,168,26,.8); }
  .act-dot.playing { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .act-dot.spotify { background: #1DB954; box-shadow: 0 0 8px rgba(29,185,84,.8); }
  .act-dot.dnd-d   { background: #ed4245; box-shadow: 0 0 6px rgba(237,66,69,.8); }

  .act-count-badge {
    display: none; align-items: center; gap: 5px;
    font-size: .55rem; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(252,238,10,.5); margin-top: 2px;
  }
  .act-count-badge.show { display: flex; }
  .act-count-badge span { color: var(--cyan); font-size: .6rem; }

  .hero-custom-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 100px;
    background: rgba(8, 12, 20, 0.45);
    border: 1px solid rgba(252,238,10,.22);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    font-size: .64rem; letter-spacing: .02em;
    color: rgba(235,245,250,.8);
    max-width: 80vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hero-custom-status .hcs-emoji:not(:empty) { line-height: 1; }
  .hero-custom-status .hcs-emoji img { width: 13px; height: 13px; display: block; }

  .bottom-links {
    width: 100%; flex-shrink: 0;
    padding: 0 12px max(16px, env(safe-area-inset-bottom, 16px));
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }

  .links-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    width: 100%;
    max-width: 900px;
  }

  .link-card {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 4px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.07);
    background: rgba(255,255,255,.025);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    text-decoration: none;
    touch-action: manipulation;
    transition: border-color .2s, background .2s, transform .15s, box-shadow .2s;
    -webkit-tap-highlight-color: transparent;
    position: relative; overflow: hidden;
    min-width: 0;
  }
  .link-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(252,238,10,.5), transparent);
    transform: scaleX(0); transition: transform .28s ease;
  }
  @media (pointer: fine) {
    .link-card { cursor: none; }
    .link-card:hover {
      border-color: rgba(252,238,10,.3); background: rgba(252,238,10,.06);
      transform: translateY(-4px); box-shadow: 0 10px 28px rgba(252,238,10,.09);
    }
    .link-card:hover::before { transform: scaleX(1); }
    .link-card:hover .lc-name { color: var(--pink); }
  }
  @media (pointer: coarse) {
    .link-card:active { background: rgba(252,238,10,.08); transform: scale(.97); }
  }

  .lc-icon {
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .lc-icon svg { width: 100%; height: 100%; display: block; }
  .link-card .lc-icon svg { transition: fill .2s, opacity .2s; }

  .lc-name {
    font-size: .58rem; letter-spacing: .08em; text-transform: uppercase;
    color: rgba(240,234,248,.85); transition: color .2s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .lc-handle {
    font-size: .5rem; letter-spacing: .03em; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }

  .lc-handle.lc-live {
    display: inline-flex; align-items: center; gap: 4px;
    color: rgba(240,234,248,.6);
  }
  .lc-live-dot {
    width: 5px; height: 5px; border-radius: 50%; background: #FF0033; flex-shrink: 0;
    box-shadow: 0 0 6px rgba(255,0,51,.9);
    animation: liveDotPulse 1.6s ease-in-out infinite;
  }
  @keyframes liveDotPulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%     { opacity: .35; transform: scale(.8); }
  }
  .lc-live-num { transition: color .3s ease; }
  .lc-live-num.bump { color: var(--pink); }

  .dc-card-wrap {
    position: relative;
  }

  /* ───────────────────────────────────────────
     DISCORD PROFILE POPOUT (visual match)
  ─────────────────────────────────────────── */
  .dc-dropdown {
    position: fixed; left: 12px; bottom: 80px;
    width: 300px; max-width: calc(100vw - 24px);
    border-radius: 14px;
    background: var(--dc-bg);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    padding: 0; z-index: 100;
    border: 1px solid rgba(252,238,10,.25);
    box-shadow: 0 12px 40px rgba(252,238,10,.35), 0 0 0 1px rgba(252,238,10,.08), inset 0 1px 0 rgba(255,255,255,.04);
    display: none; flex-direction: column;
    max-height: 460px; overflow: hidden;
    font-family: "gg sans", "IBM Plex Mono", monospace;
  }
  .dc-dropdown.open { display: flex; }

  .dc-scroll {
    overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent;
  }
  .dc-scroll::-webkit-scrollbar { width: 8px; }
  .dc-scroll::-webkit-scrollbar-track { background: transparent; }
  .dc-scroll::-webkit-scrollbar-thumb { background: rgba(252,238,10,.4); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }

  .dc-banner {
    height: 64px; width: 100%;
    background: linear-gradient(135deg, #FCEE0A 0%, #FCEE0A 60%, #00F0FF 100%);
    position: relative; flex-shrink: 0;
  }

  .dc-identity {
    padding: 0 16px 12px; position: relative;
  }
  .dc-identity-top {
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .dc-avatar-wrap {
    width: 80px; height: 80px; position: relative;
    margin-top: -40px;
  }
  .dc-go-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 12px; margin-bottom: 2px;
    border-radius: 6px; border: 1px solid rgba(252,238,10,.35);
    background: rgba(252,238,10,.12);
    color: var(--pink); text-decoration: none;
    font-size: .68rem; font-weight: 600; letter-spacing: .02em;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .dc-go-btn:hover { background: rgba(252,238,10,.22); border-color: rgba(252,238,10,.6); }
  .dc-go-btn:active { transform: scale(.95); }
  .dc-avatar-wrap img {
    width: 80px; height: 80px; border-radius: 50%;
    border: 6px solid var(--dc-ring);
    display: block; object-fit: cover; background: var(--dc-bg-2);
  }
  .dc-status-badge {
    position: absolute; right: 1px; bottom: 1px;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--dc-offline);
    border: 6px solid var(--dc-ring);
    box-sizing: content-box;
    display: flex; align-items: center; justify-content: center;
  }
  .dc-status-badge.online { background: var(--dc-online); }
  .dc-status-badge.idle   { background: var(--dc-idle); }
  .dc-status-badge.dnd    { background: var(--dc-dnd); }
  .dc-status-badge.offline{ background: var(--dc-offline); }
  .dc-status-badge.idle::before {
    content:''; position:absolute; width:11px; height:11px; border-radius:50%;
    background: var(--dc-ring); top:3px; left:2px;
  }
  .dc-status-badge.dnd::before {
    content:''; position:absolute; width:10px; height:3px; border-radius:2px;
    background: var(--dc-ring);
  }

  .dc-name-block { margin-top: 10px; }
  .dc-display-name {
    font-size: 1.05rem; font-weight: 700; color: var(--dc-text);
    line-height: 1.2; letter-spacing: 0;
  }
  .dc-username {
    font-size: .72rem; color: var(--dc-muted); margin-top: 1px;
  }

  .dc-section-card {
    margin: 10px 16px 12px; padding: 10px;
    background: var(--dc-bg-2);
    border: 1px solid rgba(252,238,10,.14);
    border-radius: 10px;
  }
  .dc-section-card + .dc-section-card { margin-top: -2px; }

  .dc-custom-status {
    display: flex; align-items: center; gap: 8px;
    font-size: .8rem; color: var(--dc-text);
    padding: 2px 0;
  }
  .dc-custom-status img.emoji { width: 16px; height: 16px; }

  .dc-rp-header {
    font-size: .68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .02em; color: var(--dc-header);
    margin-bottom: 8px;
  }

  .dc-rp-row { display: flex; gap: 12px; }
  .dc-rp-art-wrap { position: relative; flex-shrink: 0; width: 60px; height: 60px; }

  .dc-rp-art-badge {

  .dc-rp-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .dc-rp-title { font-size: .82rem; font-weight: 700; color: var(--dc-text); line-height: 1.25; }
  .dc-rp-detail { font-size: .78rem; color: var(--dc-header); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dc-rp-state { font-size: .78rem; color: var(--dc-header); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dc-sp-row { display: flex; gap: 12px; align-items: center; }

  .dc-sp-times { display: flex; justify-content: space-between; font-size: .62rem; color: var(--dc-muted); margin-top: 4px; }

  .dc-empty {

  .dc-loading-block {
    margin: 10px 16px 12px; height: 60px; border-radius: 10px;
    border: 1px solid rgba(252,238,10,.14);
    background: linear-gradient(90deg, rgba(252,238,10,.06) 25%, rgba(252,238,10,.16) 50%, rgba(252,238,10,.06) 75%);
    background-size: 600px 100%; animation: shimmer 1.5s infinite;
  }
  @keyframes shimmer { 0%{background-position:-300px 0} 100%{background-position:300px 0} }

  .footer-txt {
    font-size: .5rem; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(240,234,248,.14); text-align: center;
  }

  #mute-btn {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom, 20px)); right: 16px;
    z-index: 200; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(252,238,10,.25); background: rgba(5,5,8,.72);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    transition: border-color .2s, background .2s, transform .15s, opacity .3s;
    opacity: 0; pointer-events: none; -webkit-tap-highlight-color: transparent;
  }
  #mute-btn.show { opacity: 1; pointer-events: all; }
  #mute-btn svg { width: 16px; height: 16px; fill: none; stroke: rgba(252,238,10,.75); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: stroke .2s; }
  @media (pointer: fine) {
    #mute-btn { cursor: none; }
    #mute-btn:hover { border-color: rgba(252,238,10,.55); background: rgba(252,238,10,.12); transform: scale(1.1); }
    #mute-btn:hover svg { stroke: var(--pink); }
  }
  @media (pointer: coarse) {
    #mute-btn:active { transform: scale(.93); background: rgba(252,238,10,.15); }
  }

  @media (min-width: 700px) {
    .links-row {
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));

  @media (max-width: 699px) {

    .link-card { padding: 9px 10px; gap: 3px; border-radius: 8px; }

  @media (max-width: 360px) {

  @media (max-height: 700px) {
    .top-bar { padding-top: 12px; }

    .activity-divider { margin: 8px 0; }
    .hero-tagline { margin-top: 10px; }

  @media (max-height: 580px) {
    .hero-name { font-size: clamp(2.4rem, 9vw, 5.5rem); }
    .activity-divider { margin: 6px 0; }
    .hero-activity-wrap { min-height: 30px; }
    .hero-tagline { margin-top: 6px; font-size: .6rem; }
    .top-bar { padding-top: 8px; }
    .bottom-links { padding-bottom: 6px; gap: 4px; }
    .link-card { padding: 6px 8px; gap: 2px; }
    .lc-handle { display: none; }
  }

  /* ── CYBERPUNK: EDGERUNNERS ── */
  body::after {
    content:''; position: fixed; inset: 0; z-index: 9000; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0, rgba(0,0,0,.22) 1px, transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
  }
  .bg-glow-b { background: radial-gradient(circle, rgba(0,240,255,.10) 0%, transparent 70%) !important; }
  .hero-name {
    text-shadow: 3px 0 rgba(0,240,255,.75), -3px 0 rgba(255,40,80,.6), 0 0 60px rgba(252,238,10,.25) !important;
    animation: glitchJitter 5s steps(1) infinite;
  }
  @keyframes glitchJitter {
    0%,92%,100% { transform: translate(0); filter: none; }
    93% { transform: translate(-4px,1px); filter: hue-rotate(40deg); }
    95% { transform: translate(5px,-2px); }
    97% { transform: translate(-2px,0); filter: hue-rotate(-40deg); }
  }
  .enter-card, .link-card, .dc-dropdown, .hero-custom-status {
    border-radius: 0 !important;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .enter-card::before { border-radius: 0 !important; }
  .e-avatar, .e-avatar::after { border-radius: 0 !important; clip-path: polygon(0 0, 85% 0, 100% 15%, 100% 100%, 15% 100%, 0 85%); }
  .e-cta { border-radius: 0 !important; clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px)); }
  .e-name, .lc-name, .status-pill { text-shadow: 0 0 10px rgba(252,238,10,.35); }
  .lc-name { color: rgba(0,240,255,.9) !important; }
  .link-card { border-color: rgba(252,238,10,.22) !important; background: rgba(252,238,10,.03) !important; }
  .link-card:hover .lc-name { color: #FCEE0A !important; }
  .hero-tagline { color: rgba(0,240,255,.7) !important; }
  .footer-txt { color: rgba(252,238,10,.3) !important; }
  .dc-sp-bar-fill { background: linear-gradient(90deg, #FCEE0A, #00F0FF) !important; }

  #viz {
    position: fixed; left: 0; bottom: 0; width: 100vw; height: 190px;
    z-index: 5; pointer-events: none; opacity: .85;
    -webkit-mask-image: linear-gradient(to top, #000 30%, transparent);
            mask-image: linear-gradient(to top, #000 30%, transparent);
  }

  /* ── BEAT SYNC (driven by --beat / --bass set from JS) ── */
  :root { --beat: 0; --bass: 0; --beat-n: 0; }
  #bg-video {
    filter: saturate(calc(.8 + var(--beat) * .5)) brightness(calc(.5 + var(--beat) * .28 + var(--bass) * .1)) contrast(1.15) !important;
    scale: calc(1 + var(--beat) * .025);
  }
  .bg-glow-a { scale: calc(1 + var(--beat) * .22 + var(--bass) * .08); opacity: calc(.7 + var(--beat) * .3); }
  .bg-glow-b { scale: calc(1 + var(--beat) * .35); opacity: calc(.6 + var(--beat) * .4); }
  .hero-name {
    scale: calc(1 + var(--beat) * .055);
    text-shadow:
      calc(3px + var(--beat) * 7px) 0 rgba(0,240,255,calc(.6 + var(--beat) * .4)),
      calc(-3px - var(--beat) * 7px) 0 rgba(255,40,80,calc(.5 + var(--beat) * .4)),
      0 0 calc(40px + var(--beat) * 90px) rgba(252,238,10,calc(.25 + var(--beat) * .55)) !important;
  }
  .hero-tagline { scale: calc(1 + var(--beat) * .03); }
  .top-status { scale: calc(1 + var(--beat) * .08); }
  .top-status-avatar { box-shadow: 0 0 calc(var(--beat) * 18px) rgba(252,238,10,calc(var(--beat) * .9)); }
  .activity-divider { scale: calc(1 + var(--beat) * 1.2) 1; opacity: calc(.6 + var(--beat) * .4); }
  .hero-activity .act-dot { scale: calc(1 + var(--beat) * .6); }
  .link-card {
    border-color: rgba(252,238,10,calc(.22 + var(--beat) * .5)) !important;
    box-shadow: 0 0 calc(var(--beat) * 22px) rgba(252,238,10,calc(var(--beat) * .35)), inset 0 0 calc(var(--beat) * 14px) rgba(0,240,255,calc(var(--beat) * .18));
  }
  .link-card::before { transform: scaleX(var(--beat)); }
  .lc-icon { scale: calc(1 + var(--beat) * .22); rotate: calc((var(--beat-n) * 2 - 1) * var(--beat) * 6deg); }
  .footer-txt { opacity: calc(.7 + var(--beat) * .3); }
  .stars { opacity: calc(.6 + var(--beat) * .6); scale: calc(1 + var(--beat) * .02); }
  #mute-btn svg { stroke-width: calc(1.8 + var(--beat) * 1); }
  #mute-btn.show { box-shadow: 0 0 calc(var(--beat) * 20px) rgba(252,238,10,calc(var(--beat) * .6)); }
  #viz { opacity: calc(.7 + var(--beat) * .3); }
  body::after { opacity: calc(1 - var(--beat) * .35); }
  #beat-flash {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 55%, rgba(252,238,10,.22), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(var(--status-rgb),.25), transparent 55%);
    opacity: calc(var(--beat) * .75);
  }
  #beat-vignette {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(var(--status-rgb),.35) 100%);
    opacity: var(--beat);
  }
  @media (prefers-reduced-motion: reduce) {
    #bg-video, .bg-glow-a, .bg-glow-b, .hero-name, .hero-tagline, .top-status, .lc-icon, .stars, .activity-divider { scale: 1 !important; rotate: 0deg !important; }
    #beat-flash { opacity: calc(var(--beat) * .2); }
  }

  /* ── MOBILE FIXES ── */
  @media (pointer: coarse), (max-width: 699px) {
    /* animating filters / big blurs every frame is too heavy for phones: keep them static,
       the flash + vignette + scale pulses carry the beat instead */
    #bg-video { filter: saturate(.8) brightness(.55) contrast(1.15) !important; scale: 1; }
    .hero-name { text-shadow: 3px 0 rgba(0,240,255,.75), -3px 0 rgba(255,40,80,.6), 0 0 40px rgba(252,238,10,.3) !important; }
    .link-card { box-shadow: none !important; }
    .top-status-avatar, #mute-btn.show { box-shadow: none; }
    body::after {
      opacity: 1; mix-blend-mode: normal;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0, rgba(0,0,0,.14) 1px, transparent 1px, transparent 3px);
    }
  }
  @media (max-width: 699px) {
    .top-bar { padding-top: max(18px, env(safe-area-inset-top, 18px)); }
    #mute-btn { top: max(14px, env(safe-area-inset-top, 14px)); bottom: auto; right: 14px; }
    .hero-name { font-size: clamp(2.6rem, 14vw, 5.5rem); }
    .hero-tagline { padding: 0 8px; line-height: 1.5; }
    .enter-card { padding: 34px 30px 30px; }
    .e-name { font-size: 1.8rem; }
    .link-card { min-height: 46px; }
    .lc-name { font-size: .6rem; }
    .lc-handle { font-size: .54rem; }
  }
  @media (max-height: 450px) and (orientation: landscape) {
    .hero-tagline, .activity-divider, .act-count-badge { display: none; }
    .hero-name { font-size: clamp(2rem, 14vh, 4rem); }
    .links-row { grid-template-columns: repeat(7, 1fr); max-width: 100%; gap: 4px; }
    .link-card.riot-card { grid-column: auto; }
    .link-card { padding: 6px; min-height: 0; }
    .lc-handle { display: none; }
    .top-bar { padding-top: 6px; }
    .bottom-links { padding-bottom: max(6px, env(safe-area-inset-bottom, 6px)); }
    #mute-btn { top: 8px; right: 10px; width: 32px; height: 32px; }
  }

  /* ── EDGERUNNERS TITLE GLITCH ── */
  @keyframes flickerOn {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    14%  { opacity: .05; }
    24%  { opacity: 1; }
    30%  { opacity: .25; }
    42%  { opacity: 1; }
    52%  { opacity: .5; }
    58%  { opacity: 1; }
    100% { opacity: 1; }
  }
  .hero-name { position: relative; }
  .hero-name::before, .hero-name::after {
    content: attr(data-text);
    position: absolute; inset: 0;
    text-align: center; pointer-events: none;
    opacity: 0; text-shadow: none !important;
    mix-blend-mode: screen;
  }
  .hero-name::before { color: #00F0FF; }
  .hero-name::after  { color: #ff2850; }
  .hero-name.glitching::before { opacity: .95; animation: sliceA .32s steps(1) 1; }
  .hero-name.glitching::after  { opacity: .95; animation: sliceB .32s steps(1) 1; }
  .hero-name.glitching { animation: glitchJitter 5s steps(1) infinite, titleShake .32s steps(1) 1; }
  @keyframes sliceA {
    0%   { clip-path: inset(8% 0 72% 0);  transform: translate(-10px, 0); }
    16%  { clip-path: inset(52% 0 24% 0); transform: translate(8px, 1px); }
    32%  { clip-path: inset(30% 0 48% 0); transform: translate(-14px, 0); }
    48%  { clip-path: inset(74% 0 6% 0);  transform: translate(12px, -1px); }
    64%  { clip-path: inset(18% 0 60% 0); transform: translate(-6px, 0); }
    80%  { clip-path: inset(60% 0 14% 0); transform: translate(10px, 0); }
    100% { clip-path: inset(0 0 100% 0);  transform: translate(0, 0); }
  }
  @keyframes sliceB {
    0%   { clip-path: inset(66% 0 10% 0); transform: translate(12px, 0); }
    16%  { clip-path: inset(12% 0 68% 0); transform: translate(-9px, -1px); }
    32%  { clip-path: inset(44% 0 36% 0); transform: translate(15px, 0); }
    48%  { clip-path: inset(4% 0 80% 0);  transform: translate(-11px, 1px); }
    64%  { clip-path: inset(58% 0 22% 0); transform: translate(7px, 0); }
    80%  { clip-path: inset(26% 0 52% 0); transform: translate(-12px, 0); }
    100% { clip-path: inset(0 0 100% 0);  transform: translate(0, 0); }
  }
  @keyframes titleShake {
    0%   { filter: none; }
    20%  { filter: hue-rotate(50deg) brightness(1.4); }
    40%  { filter: none; }
    60%  { filter: hue-rotate(-50deg) brightness(1.25); }
    80%  { filter: contrast(1.6); }
    100% { filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-name::before, .hero-name::after { display: none; }
  }

  /* ── DISCORD FEATURES ── */
  :root { --status-rgb: 0,240,255; }
  .bg-glow-b { background: radial-gradient(circle, rgba(var(--status-rgb),.12) 0%, transparent 70%) !important; }
  .dc-banner { background: linear-gradient(135deg, #FCEE0A 0%, #FCEE0A 55%, rgb(var(--status-rgb)) 100%) !important; }

  .top-status { gap: 8px; }
  .dev-icons, .dc-devices { display: inline-flex; align-items: center; gap: 6px; }
  .dev-icons:empty, .dc-devices:empty, .dc-badges:empty, .dc-tag:empty, .dc-lastseen:empty { display: none; }
  .dev-icons svg, .dc-devices svg { width: 13px; height: 13px; fill: none; stroke: rgba(235,245,250,.55); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dc-devices { margin-top: 8px; }

  .dc-avatar-wrap img.dc-deco {
    display: none; position: absolute; width: 96px; height: 96px; left: -8px; top: -8px;
    border: 0; border-radius: 0; background: none; pointer-events: none;
  }
  .dc-avatar-wrap img.dc-deco.show { display: block; }

  .dc-display-name { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dc-tag {
    display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 4px;
    background: rgba(252,238,10,.14); border: 1px solid rgba(252,238,10,.3);
    font-size: .62rem; font-weight: 700; letter-spacing: .04em; color: var(--dc-text);
  }
  .dc-tag img { width: 12px; height: 12px; display: block; }
  .dc-username { cursor: none; width: fit-content; transition: color .2s; }
  @media (pointer: coarse) { .dc-username { cursor: pointer; } }
  .dc-username:hover { color: var(--pink); }
  .dc-lastseen { font-size: .66rem; color: var(--dc-muted); margin-top: 3px; font-style: italic; }
  .dc-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .dc-badge {
    padding: 1px 6px; border-radius: 4px; font-size: .56rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--bc, #fff); border: 1px solid var(--bc, #fff); background: rgba(255,255,255,.04);
  }
  .dc-btn-row { display: flex; gap: 6px; }
  .dc-banner { transition: height .3s ease; }
  .dc-banner.has-img { height: 88px; }

  .act-dot.live { background: #ff2850; box-shadow: 0 0 8px rgba(255,40,80,.9); animation: liveDotPulse 1.6s ease-in-out infinite; }
  .live-badge {
    margin-left: 6px; padding: 1px 5px; border-radius: 3px; background: #ff2850; color: #fff;
    font-size: .56rem; letter-spacing: .08em; vertical-align: 1px;
  }
  .dc-rp-link { color: inherit; text-decoration: none; }
  .dc-rp-link:hover { text-decoration: underline; color: var(--pink); }
  .dc-note { font-size: .78rem; color: var(--dc-text); line-height: 1.4; }
  .dc-note .dc-rp-header { margin-bottom: 4px; }

  .srv-icon-img { width: 18px; height: 18px; border-radius: 5px; display: block; object-fit: cover; }
  .lc-on-dot { width: 5px; height: 5px; border-radius: 50%; background: #3ba55c; box-shadow: 0 0 6px rgba(59,165,92,.9); flex-shrink: 0; }
</style>

<body>

<div id="cur"></div>
<div id="cur-r"></div>
<video id="bg-video" loop muted playsinline src="bg.mp4"></video>
<audio id="bg-audio" loop preload="auto" src="song.mp3"></audio>
<div class="bg-glow bg-glow-a"></div>
<div class="bg-glow bg-glow-b"></div>
<div class="stars" id="stars"></div>
<canvas id="viz"></canvas>
<div id="beat-flash"></div>
<div id="beat-vignette"></div>

<button id="mute-btn" aria-label="Mute audio">
  <svg id="icon-sound" viewBox="0 0 24 24">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
  </svg>
  <svg id="icon-mute" viewBox="0 0 24 24" style="display:none">
    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
    <line x1="23" y1="9" x2="17" y2="15"/>
    <line x1="17" y1="9" x2="23" y2="15"/>
  </svg>
</button>

<div id="enter-overlay">
  <button id="enter-btn" aria-label="Enter">

      <div class="e-avatar"><img class="js-avatar" src="senpai-mio.gif" alt="Shiroo"/></div>

      <div class="e-dots"><span></span><span></span><span></span></div>

</div>

<main id="main">
  <div class="top-bar">
    <div class="top-status" id="top-status">
      <span class="top-status-avatar-wrap">
        <img src="senpai-mio.gif" alt="Shiroo" class="top-status-avatar js-avatar">

      </span>

  </div>

  <div class="hero">
    <h1 class="hero-name">Shiroo ౨ৎ ˎˊ˗</h1>
    <p class="hero-tagline" id="tagline"></p>
    <div class="activity-divider" id="activity-divider"></div>
    <div class="hero-activity-wrap" id="hero-activity-wrap">
      <div class="hero-activity" id="act-primary">
        <span class="act-dot" id="act-dot"></span>
        <span id="act-text">loading activity</span>
      </div>

      <span id="act-count-num"></span> Activities running
    </div>
  </div>

  <div class="bottom-links">

      <span class="hcs-emoji" id="hcs-emoji"></span><span id="hcs-text"></span>

<script>
(function(){
  'use strict';

  const overlay   = document.getElementById('enter-overlay');
  const mainEl    = document.getElementById('main');
  const muteBtn   = document.getElementById('mute-btn');
  const iconSound = document.getElementById('icon-sound');
  const iconMute  = document.getElementById('icon-mute');
  const video     = document.getElementById('bg-video');
  const audio     = document.getElementById('bg-audio');
  const enterBtn  = document.getElementById('enter-btn');
  video.muted = true;

  /* ── audio visualizer ── */
  let vizGain = null, vizAnalyser = null, vizData = null, vizStarted = false;
  const vizCanvas = document.getElementById('viz');
  const vizCtx = vizCanvas.getContext('2d');
  const BARS = 72;
  const smooth = new Array(BARS).fill(0);

  function vizResize() {
    const dpr = window.devicePixelRatio || 1;
    vizCanvas.width  = vizCanvas.clientWidth  * dpr;
    vizCanvas.height = vizCanvas.clientHeight * dpr;
  }
  window.addEventListener('resize', vizResize);
  vizResize();

  function initViz() {
    if (vizStarted) return;
    vizStarted = true;
    // On file:// the browser silences MediaElementSource, so only hook the real
    // analyser when served over http(s); otherwise use a simulated visualizer.
    if (location.protocol.startsWith('http')) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const ctx = new AC();
        const src = ctx.createMediaElementSource(audio);
        vizAnalyser = ctx.createAnalyser();
        vizAnalyser.fftSize = 512;
        vizAnalyser.smoothingTimeConstant = 0.6;
        vizGain = ctx.createGain();
        vizGain.gain.value = isMuted ? 0 : 1;
        src.connect(vizAnalyser);
        vizAnalyser.connect(vizGain);
        vizGain.connect(ctx.destination);
        vizData = new Uint8Array(vizAnalyser.frequencyBinCount);
        if (ctx.state === 'suspended') ctx.resume();
      } catch (e) { console.warn('Visualizer analyser unavailable:', e); vizAnalyser = null; vizGain = null; }
    }
    requestAnimationFrame(vizLoop);
  }

  /* ── beat engine: drives --beat / --bass / --beat-n on <html> ── */
  const FALLBACK_BPM = 120;       // only used when the real analyser can't run (e.g. file://)
  const root = document.documentElement;
  const bassHist = [];
  let nameGlitch = null;   // set by the title block below
  let lastBeatStr = '', lastBassStr = '';
  let beat = 0, bass = 0, beatN = 0, lastBeatT = 0, lastT = 0, fbNext = 0;

  function fireBeat(t, strength) {
    lastBeatT = t;
    beat = Math.max(beat, strength);
    beatN++;
    root.style.setProperty('--beat-n', beatN % 2);   // alternates 0/1 for left-right swaps
    if (nameGlitch && strength > 0.8 && beatN % 4 === 0) nameGlitch();   // slice-glitch the title on strong downbeats
  }

  function beatTick(t) {
    const dt = Math.min(64, t - lastT || 16); lastT = t;
    const playing = !audio.paused;

    if (vizAnalyser && playing) {
      // low-end energy (≈ 40–350 Hz) → kick / bass
      let sum = 0;
      for (let i = 1; i <= 4; i++) sum += vizData[i];
      const e = sum / 4 / 255;
      bass += (e - bass) * 0.5;
      bassHist.push(e);
      if (bassHist.length > 50) bassHist.shift();
      let avg = 0; for (const v of bassHist) avg += v; avg /= bassHist.length;
      let varc = 0; for (const v of bassHist) varc += (v - avg) * (v - avg); varc /= bassHist.length;
      const thr = avg + Math.max(0.06, Math.sqrt(varc) * 1.25);
      if (e > thr && e > 0.3 && t - lastBeatT > 230) {
        fireBeat(t, Math.min(1, 0.55 + (e - avg) * 2.2));
      }
    } else if (playing) {
      // fallback metronome so the page still pulses when audio can't be analysed
      const period = 60000 / FALLBACK_BPM;
      if (!fbNext) fbNext = t + period;
      if (t >= fbNext) { fireBeat(t, 0.9); fbNext += period; if (fbNext < t) fbNext = t + period; }
      bass += ((0.25 + 0.5 * beat) - bass) * 0.2;
    } else {
      bass *= 0.9; fbNext = 0;
    }

    beat *= Math.exp(-dt / 150);   // fast, punchy decay after each hit
    if (beat < 0.004) beat = 0;
    const bs = beat.toFixed(3), bsa = bass.toFixed(2);
    if (bs !== lastBeatStr) { root.style.setProperty('--beat', bs); lastBeatStr = bs; }
    if (bsa !== lastBassStr) { root.style.setProperty('--bass', bsa); lastBassStr = bsa; }
  }

  function vizLoop(t) {
    requestAnimationFrame(vizLoop);
    const w = vizCanvas.width, h = vizCanvas.height;
    vizCtx.clearRect(0, 0, w, h);
    const active = !audio.paused && !isMuted;
    if (vizAnalyser) vizAnalyser.getByteFrequencyData(vizData);
    beatTick(t);

    const half = BARS / 2, gap = w * 0.004;
    const bw = (w / 2) / half - gap;
    const grad = vizCtx.createLinearGradient(0, h, 0, 0);
    grad.addColorStop(0, '#FCEE0A');
    grad.addColorStop(1, '#00F0FF');
    vizCtx.fillStyle = grad;
    vizCtx.shadowColor = 'rgba(252,238,10,.6)';
    vizCtx.shadowBlur = 10;

    for (let i = 0; i < half; i++) {
      let v;
      if (vizAnalyser) {
        const bin = Math.floor(Math.pow(i / half, 1.5) * vizData.length * 0.7);
        v = vizData[bin] / 255;
      } else {
        const x = t / 1000;
        v = active ? (0.35 + 0.35 * Math.sin(x * 3 + i * 0.5) * Math.sin(x * 1.3 + i * 0.21) + 0.2 * Math.sin(x * 7 + i)) : 0;
        v = Math.max(0, v) * (1 - i / half * 0.6);
      }
      if (!active && vizAnalyser && isMuted) v = 0;
      smooth[i] += (v - smooth[i]) * 0.35;
      const bh = Math.max(2, smooth[i] * h * 0.95);
      const xr = w / 2 + i * (bw + gap);
      const xl = w / 2 - (i + 1) * (bw + gap);
      vizCtx.fillRect(xr, h - bh, bw, bh);
      vizCtx.fillRect(xl, h - bh, bw, bh);
    }
  }
  let isMuted = false;
  let entered = false;

  function doEnter() {
    if (entered) return;
    entered = true;
    overlay.classList.add('fade-out');
    mainEl.classList.add('visible');
    setTimeout(() => overlay.classList.add('gone'), 1000);
    video.play().catch(e => console.warn('Autoplay blocked:', e));
    audio.volume = 0.6;
    audio.play().catch(e => console.warn('Audio blocked:', e));
    initViz();
    setTimeout(() => muteBtn.classList.add('show'), 600);
  }

  enterBtn.addEventListener('click', doEnter);
  enterBtn.addEventListener('touchend', function(e) {
    e.preventDefault();
    doEnter();
  });

  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    isMuted = !isMuted;
    if (vizGain) vizGain.gain.value = isMuted ? 0 : 1; else audio.muted = isMuted;
    iconSound.style.display = isMuted ? 'none' : '';
    iconMute.style.display  = isMuted ? ''     : 'none';
    muteBtn.setAttribute('aria-label', isMuted ? 'Unmute audio' : 'Mute audio');
  });

  const cur  = document.getElementById('cur');
  const curR = document.getElementById('cur-r');
  if (window.matchMedia('(pointer:fine)').matches && cur) {
    let mx=-100, my=-100, rx=-100, ry=-100;
    document.addEventListener('mousemove', e => {
      mx=e.clientX; my=e.clientY;
      cur.style.left=mx+'px'; cur.style.top=my+'px';
    });
    (function loop(){ rx+=(mx-rx)*.12; ry+=(my-ry)*.12; curR.style.left=rx+'px'; curR.style.top=ry+'px'; requestAnimationFrame(loop); })();
    document.querySelectorAll('a,button,.link-card').forEach(el => {
      el.addEventListener('mouseenter',()=>{ cur.classList.add('h'); curR.classList.add('h'); });
      el.addEventListener('mouseleave',()=>{ cur.classList.remove('h'); curR.classList.remove('h'); });
    });
  }

  /* wave effect on hero name */
  (function(){
    const h = document.querySelector('.hero-name');
    if (!h) return;
    const txt = h.textContent;
    h.setAttribute('aria-label', txt);
    h.setAttribute('data-text', txt);
    h.textContent = '';
    [...txt].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'wv';
      s.style.setProperty('--i', i);
      s.setAttribute('aria-hidden', 'true');
      s.textContent = ch;
      h.appendChild(s);
    });

    // Edgerunners-style glitch bursts: random every few seconds + on strong beats (see fireBeat)
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let gt = null;
    nameGlitch = function(){
      h.classList.remove('glitching'); void h.offsetWidth; h.classList.add('glitching');
      clearTimeout(gt); gt = setTimeout(() => h.classList.remove('glitching'), 340);
    };
    (function loop(){
      setTimeout(() => { if (entered) nameGlitch(); loop(); }, 2200 + Math.random() * 3800);
    })();
    // double-tap feel: occasionally a quick second burst
    setInterval(() => { if (entered && Math.random() < .25) setTimeout(nameGlitch, 140); }, 6000);
  })();

  /* click to copy Riot ID */
  (function(){
    const card = document.getElementById('riot-card');
    const handle = document.getElementById('riot-handle');
    if (!card || !handle) return;
    const RIOT_ID = 'Laksh #灰宮美桜';
    let t = null;

    function fallbackCopy(text){
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:-100px;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch(e) {}

  function artTint(url){
    return new Promise(res => {
      if (!url) return res(null);
      if (tintCache.has(url)) return res(tintCache.get(url));
      const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = () => {
        try {
          const c = document.createElement('canvas'); c.width = c.height = 8;
          const x = c.getContext('2d'); x.drawImage(im, 0, 0, 8, 8);
          const d = x.getImageData(0, 0, 8, 8).data;
          let r=0,g=0,b=0,n=0;
          for (let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
          const t = [Math.round(r/n), Math.round(g/n), Math.round(b/n)];
          tintCache.set(url, t); res(t);
        } catch(e){ tintCache.set(url, null); res(null); }
      };
      im.onerror = () => res(null);
      im.src = url;
    });
  }

  const dcToggle = document.getElementById('dc-toggle-card');

    const w = Math.min(300, vw - 24);
    const left = Math.max(12, Math.min(r.left + r.width/2 - w/2, vw - w - 12));
    dcDrop.style.width = w + 'px';
    dcDrop.style.left = left + 'px';
    dcDrop.style.bottom = Math.max(8, vh - r.top + 8) + 'px';

  }
  function closeDrop(){ dcDrop.classList.remove('open'); }
  dcToggle.addEventListener('click', e=>{
    e.stopPropagation();
    if (dcDrop.classList.contains('open')) closeDrop();
    else { placeDrop(); dcDrop.classList.add('open'); }
  });
  window.addEventListener('resize', ()=>{ if (dcDrop.classList.contains('open')) placeDrop(); });
  window.addEventListener('orientationchange', closeDrop);

  // iOS doesn't send document click for taps on non-clickable areas, so also listen for taps —

  let tStartX = 0, tStartY = 0, tMoved = false;
  document.addEventListener('touchstart', e=>{ const t=e.touches[0]; tStartX=t.clientX; tStartY=t.clientY; tMoved=false; }, {passive:true});
  document.addEventListener('touchmove', e=>{ const t=e.touches[0]; if (Math.abs(t.clientX-tStartX)>10 || Math.abs(t.clientY-tStartY)>10) tMoved=true; }, {passive:true});

    let t = null;
    un.addEventListener('click', e=>{
      e.stopPropagation();
      const val = un.dataset.copy || 'shirovae';
      const before = un.textContent;
      copyText(val).then(ok=>{
        un.classList.add('flash'); un.textContent = ok ? 'copied!' : 'copy failed';
        clearTimeout(t);
        t = setTimeout(()=>{ un.classList.remove('flash'); un.textContent = before; }, 1200);
      });
    });
  })();

  // live server card (member / online counts from the public invite)
  (function(){
    const INVITE = 'Kj6RAeazmg';
    const iconEl = document.getElementById('srv-icon');
    const handle = document.getElementById('srv-handle');
    const origIcon = iconEl.innerHTML, origHandle = handle.textContent;
    let lastOn = null, iconSrc = '';
    function load(){
      fetch(`https://discord.com/api/v9/invites/${INVITE}?with_counts=true`)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(j => {
          const g = j && j.guild; if (!g) return;
          if (g.icon && iconSrc !== g.icon) {
            iconSrc = g.icon;
            const im = new Image(); im.className = 'srv-icon-img'; im.alt = '';
            im.onerror = () => { iconEl.innerHTML = origIcon; };
            im.src = `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.${g.icon.startsWith('a_')?'gif':'webp'}?size=64`;
            iconEl.innerHTML = ''; iconEl.appendChild(im);
          }
          const on = j.approximate_presence_count, mem = j.approximate_member_count;
          if (typeof on === 'number' && typeof mem === 'number') {
            handle.className = 'lc-handle lc-live';
            handle.innerHTML = `<span class="lc-on-dot"></span><span class="lc-live-num" id="srv-on">${on.toLocaleString()}</span>&nbsp;online · ${mem.toLocaleString()}`;
            if (lastOn !== null && lastOn !== on) {
              const n = document.getElementById('srv-on'); n.classList.add('bump'); setTimeout(()=>n.classList.remove('bump'), 700);
            }
            lastOn = on;
          }
        })
        .catch(() => { /* keep the static label */ });
    }
    load();
    setInterval(()=>{ if (!document.hidden) load(); }, 60000);
  })();

  const DISCORD_ID='657910178577907713';
  function fetchL(){
    fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
      .then(r=>r.json())
      .then(j=>{ if(j.success) renderAll(j.data); else { setStatus('offline'); actText.textContent='could not load'; }})
      .catch(()=>{ setStatus('offline'); actText.textContent='could not load'; });
  }
  fetchL();
  setInterval(fetchL,30000);

  (function wsConnect(){
    const ws=new WebSocket('wss://api.lanyard.rest/socket');
    ws.onopen=()=>ws.send(JSON.stringify({op:2,d:{subscribe_to_id:DISCORD_ID}}));
    ws.onmessage=e=>{
      const m=JSON.parse(e.data);
      if(m.op===1) setInterval(()=>ws.readyState===1&&ws.send(JSON.stringify({op:3})),m.d.heartbeat_interval);
      if(m.op===0&&m.t==='INIT_STATE')      renderAll(m.d);
      if(m.op===0&&m.t==='PRESENCE_UPDATE') renderAll(m.d);
    };
    ws.onclose=()=>setTimeout(wsConnect,5000);
  })();

})();
</script>
</body>
